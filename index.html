<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f8">
<title>Shared Todo</title>
<style>
  :root, :root[data-theme="light"]{
    --bg:#f4f5f8; --card:#fff; --line:#e4e6eb; --line-soft:#eef0f3;
    --text:#12151a; --muted:#6b7280; --faint:#9aa1ac;
    --accent:#4f46e5; --accent-soft:#eef0ff; --accent-ring:rgba(79,70,229,.16);
    --done:#10b981; --danger:#ef4444;
    --radius:16px; --radius-sm:11px; --tap:44px;
    --shadow:0 1px 2px rgba(16,20,26,.05), 0 6px 20px -12px rgba(16,20,26,.18);
    --toast-bg:#12151a; --seg-active-shadow:0 1px 3px rgba(16,20,26,.1);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1014; --card:#171b21; --line:#262c34; --line-soft:#1e242b;
      --text:#e8ebef; --muted:#98a1ad; --faint:#6b7481;
      --accent:#7c83ff; --accent-soft:#1b1f3a; --accent-ring:rgba(124,131,255,.22);
      --done:#34d399; --danger:#f87171;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -14px rgba(0,0,0,.6);
      --toast-bg:#2a323d; --seg-active-shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1014; --card:#171b21; --line:#262c34; --line-soft:#1e242b;
    --text:#e8ebef; --muted:#98a1ad; --faint:#6b7481;
    --accent:#7c83ff; --accent-soft:#1b1f3a; --accent-ring:rgba(124,131,255,.22);
    --done:#34d399; --danger:#f87171;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -14px rgba(0,0,0,.6);
    --toast-bg:#2a323d; --seg-active-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 100px) calc(env(safe-area-inset-left,0px) + 12px);
    overflow-x:hidden; -webkit-font-smoothing:antialiased;
    transition:background .18s ease, color .18s ease;
  }
  header{
    max-width:820px; margin:0 auto 10px;
    position:sticky; top:0; z-index:20;
    padding:8px 0 10px;
    background:linear-gradient(var(--bg) 78%, rgba(0,0,0,0));
  }
  .hrow{display:flex;align-items:center;gap:8px}
  .brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0;font-size:18px;font-weight:700;letter-spacing:-.02em}
  .brand .dot{
    width:28px;height:28px;border-radius:9px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),#8b5cf6);
    display:grid;place-items:center;color:#fff;
    box-shadow:0 4px 12px -4px var(--accent-ring);
  }
  .brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .icon-btn{
    flex:0 0 auto; width:var(--tap); height:var(--tap); padding:0;
    border-radius:12px; display:grid; place-items:center;
    border:1px solid var(--line); background:var(--card); color:var(--text);
    min-height:var(--tap);
    transition:border-color .16s, color .16s, background .16s, transform .08s;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  .icon-btn:hover{border-color:var(--accent);color:var(--accent)}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px -8px var(--accent-ring)}
  .icon-btn.primary:hover{color:#fff;opacity:.93}
  .status{
    max-width:820px;margin:0 auto 12px;font-size:12px;color:var(--faint);
    display:flex;align-items:center;gap:6px;padding:0 2px;
  }
  .status .led{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:0 0 auto}
  .status.ok .led{background:var(--done)}
  .status.warn .led{background:#f59e0b}
  main{max-width:820px;margin:0 auto}
  .empty{text-align:center;padding:56px 20px;color:var(--muted)}
  .empty .ico{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
  .empty h2{margin:0 0 6px;font-size:17px;color:var(--text);font-weight:650}
  .empty p{margin:0;font-size:14px;line-height:1.6}
  .section{
    position:relative; background:var(--card);
    border:1px solid var(--line); border-left:4px solid var(--sec,var(--accent));
    border-radius:var(--radius); padding:11px 12px 13px; margin-bottom:12px;
    box-shadow:var(--shadow); animation:rise .22s ease both;
    transition:background .18s, border-color .18s, opacity .2s;
  }
  .section::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg, var(--sec-tint,transparent), transparent 55%);pointer-events:none}
  .section > *{position:relative}
  .section.is-done{opacity:.74}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .shead{display:flex;align-items:center;gap:6px}
  .chev{flex:0 0 auto;width:30px;height:30px;padding:0;border:none;background:transparent;color:var(--faint);border-radius:8px;display:grid;place-items:center;min-height:30px}
  .chev:hover{background:var(--accent-soft);color:var(--accent);border:none}
  .chev svg{transition:transform .2s ease}
  .section:not(.collapsed) .chev svg{transform:rotate(90deg)}
  .tick{
    flex:0 0 auto; padding:0; display:grid; place-items:center;
    border:2px solid var(--line); background:transparent; color:transparent; border-radius:9px;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    transition:background .16s, border-color .16s, opacity .16s, transform .1s;
  }
  .tick:active{transform:scale(.88)}
  .sub > .shead .tick{width:28px;height:28px;border-color:var(--sec,var(--accent));opacity:.55}
  .sub > .shead .tick:hover{opacity:1}
  .sub > .shead .tick.done{background:var(--sec,var(--accent));border-color:var(--sec,var(--accent));opacity:1;color:#fff}
  .task .tick{width:24px;height:24px;border-radius:7px;border-color:var(--sec,var(--accent));opacity:.42}
  .task .tick:hover{opacity:1}
  .task .tick.done{background:var(--sec,var(--accent));border-color:var(--sec,var(--accent));opacity:1;color:#fff}
  .tick.pop{animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.2)}100%{transform:scale(1)}}
  input.title{flex:1;min-width:0;border:none;background:transparent;color:var(--text);font-size:16.5px;font-weight:650;letter-spacing:-.01em;padding:7px 4px;border-radius:8px}
  input.title:focus{outline:none}
  input.title::placeholder{color:var(--faint);font-weight:500}
  .sec-count{flex:0 0 auto;font-size:12px;font-weight:650;color:var(--faint);background:var(--bg);padding:4px 9px;border-radius:99px;font-variant-numeric:tabular-nums;letter-spacing:.01em;transition:background .2s, color .2s}
  .sec-count.done{background:color-mix(in srgb, var(--sec,var(--done)) 16%, transparent);color:var(--sec,var(--done))}
  .sec-count.empty{opacity:.55}
  .dots{flex:0 0 auto;width:34px;height:34px;padding:0;border:none;background:transparent;color:var(--faint);border-radius:9px;display:grid;place-items:center;min-height:34px}
  .dots:hover{background:var(--accent-soft);color:var(--accent);border:none}
  .ring-btn{flex:0 0 auto;width:40px;height:40px;padding:0;border:none;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--sec,var(--accent));-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .12s, opacity .16s;min-height:40px}
  .ring-btn:active{transform:scale(.9)}
  .ring-btn svg{display:block}
  .ring-btn.empty{opacity:.4}
  .ring-btn.pop{animation:ringPop .32s ease}
  @keyframes ringPop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
  .progress{display:flex;align-items:center;gap:9px;margin:8px 4px 0 34px}
  .track{flex:1;height:5px;border-radius:99px;background:var(--line-soft);overflow:hidden}
  .bar{height:100%;width:0;border-radius:99px;background:var(--sec,var(--accent));transition:width .3s cubic-bezier(.4,0,.2,1)}
  .comment-wrap{margin-top:10px;animation:rise .18s ease both}
  textarea.comment{
    width:100%;margin:0;resize:vertical;min-height:52px;font-size:16px;line-height:1.5;color:var(--text);
    background:var(--bg);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:10px 12px;
    -webkit-appearance:none;transition:border-color .16s, box-shadow .16s, background .18s;
  }
  textarea.comment:focus{outline:none;border-color:var(--sec,var(--accent));box-shadow:0 0 0 3px var(--accent-ring)}
  textarea.comment::placeholder{color:var(--faint)}
  .sub{
    position:relative;margin-top:10px;margin-left:8px;padding:8px 0 8px 14px;
    border-left:3px solid var(--sec-soft,var(--accent-soft));border-radius:0 12px 12px 0;
    animation:rise .22s ease both;
  }
  .sub.is-done{opacity:.74}
  .sub .progress{margin-left:38px}
  .sub .sec-count{font-size:11.5px;padding:3px 8px}
  .task{display:flex;align-items:center;gap:8px;padding:5px 6px;margin-top:5px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid transparent;transition:border-color .16s, background .18s;animation:rise .2s ease both}
  .task:hover{border-color:var(--line)}
  .task input.task-title{flex:1;min-width:0;border:none;background:transparent;font-size:16px;color:var(--text);padding:6px 2px;border-radius:8px}
  .task input.task-title:focus{outline:none}
  .task input.task-title::placeholder{color:var(--faint)}
  .task input.comment-line{flex:0 1 200px;min-width:80px;border:none;background:transparent;font-size:14px;color:var(--faint);padding:5px 2px;border-radius:8px}
  .task input.comment-line:focus{outline:none;color:var(--text)}
  .task input.comment-line::placeholder{color:var(--faint);opacity:.8}
  .task .tdel{flex:0 0 auto;width:30px;height:30px;padding:0;border:none;background:transparent;color:var(--faint);border-radius:8px;display:grid;place-items:center;min-height:30px;opacity:.6}
  .task .tdel:hover{background:transparent;color:var(--danger);border:none;opacity:1}
  .task.is-done{background:transparent;border-color:transparent}
  .task.is-done input.task-title{text-decoration:line-through;color:var(--faint)}
  .section.collapsed .progress,.section.collapsed > .comment-wrap,.section.collapsed > .children{display:none}
  .sub.collapsed .progress,.sub.collapsed > .comment-wrap,.sub.collapsed > .children{display:none}
  .children{margin-top:2px}
  .hidden{display:none!important}
  .fab{
    position:fixed;z-index:30;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
    width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;border:none;
    box-shadow:0 10px 26px -8px var(--accent-ring), 0 4px 12px rgba(0,0,0,.16);
    display:none;place-items:center;animation:rise .3s ease both;
  }
  .fab:hover{color:#fff;transform:scale(1.05);border:none}
  .fab:active{transform:scale(.94)}
  @media (max-width:620px){.fab{display:grid}.top-add{display:none}}
  .popmenu{position:fixed;z-index:60;min-width:200px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 12px 32px -8px rgba(0,0,0,.22), 0 4px 10px -4px rgba(0,0,0,.12);animation:popIn .14s cubic-bezier(.2,.9,.3,1.1) both}
  @keyframes popIn{from{opacity:0;transform:scale(.94) translateY(-4px)}to{opacity:1;transform:none}}
  .pmi{width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;border:none;background:transparent;color:var(--text);border-radius:10px;min-height:44px;justify-content:flex-start;font-size:15px;text-align:left}
  .pmi:hover{background:var(--accent-soft);color:var(--accent);border:none}
  .pmi.danger{color:var(--danger)}
  .pmi.danger:hover{background:rgba(239,68,68,.1);color:var(--danger)}
  .pmi .pmi-ico{width:18px;height:18px;display:grid;place-items:center;flex:0 0 auto}
  .pmi-sep{height:1px;background:var(--line-soft);margin:4px 6px}
  .sheet-wrap{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
  .sheet-wrap[hidden]{display:none}
  .sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.42);animation:fade .18s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{
    position:relative;width:100%;max-width:480px;background:var(--card);
    border-radius:22px 22px 0 0;
    padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 18px);
    box-shadow:0 -12px 40px -8px rgba(0,0,0,.28);
    animation:slideUp .24s cubic-bezier(.2,.9,.3,1.1) both;
    max-height:90vh;overflow-y:auto;transition:background .18s;
  }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
  .sheet-grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 12px}
  .sheet h3{margin:0 0 14px;font-size:16px;font-weight:700;letter-spacing:-.01em;padding:0 4px}
  .sheet-label{font-size:12px;font-weight:650;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:0 6px;margin-bottom:8px}
  .theme-seg{display:flex;gap:3px;background:var(--bg);border:1px solid var(--line-soft);border-radius:13px;padding:4px;margin-bottom:14px}
  .theme-seg button{
    flex:1;border:none;background:transparent;color:var(--muted);min-height:44px;padding:8px 6px;border-radius:10px;
    font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
    transition:background .16s, color .16s, box-shadow .16s;-webkit-tap-highlight-color:transparent;
  }
  .theme-seg button:hover{color:var(--text);border:none;background:transparent}
  .theme-seg button.active{background:var(--card);color:var(--text);box-shadow:var(--seg-active-shadow)}
  .sheet-sep{height:1px;background:var(--line-soft);margin:6px 4px 12px}
  .sheet-item{
    width:100%;display:flex;align-items:center;gap:13px;padding:13px 12px;border:none;background:transparent;color:var(--text);
    border-radius:12px;min-height:52px;justify-content:flex-start;font-size:15.5px;text-align:left;cursor:pointer;
  }
  .sheet-item:hover{background:var(--accent-soft);color:var(--accent);border:none}
  .sheet-item .sico{width:36px;height:36px;border-radius:10px;flex:0 0 auto;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
  .sheet-item.danger{color:var(--danger)}
  .sheet-item.danger .sico{background:rgba(239,68,68,.12);color:var(--danger)}
  .sheet-item .sub{display:block;font-size:12.5px;color:var(--faint);margin-top:2px}
  @media (min-width:640px){.sheet-wrap{align-items:center}.sheet{border-radius:22px;padding-bottom:18px;max-width:420px}.sheet-grip{display:none}}
  /* cloud status box */
  .cloud-box{
    display:flex;align-items:center;gap:12px;padding:12px 14px;
    background:var(--bg);border:1px solid var(--line-soft);border-radius:12px;margin:0 4px 12px;
  }
  .cloud-box .cloud-led{width:10px;height:10px;border-radius:50%;background:var(--faint);flex:0 0 auto}
  .cloud-box.on .cloud-led{background:var(--done);box-shadow:0 0 0 4px rgba(16,185,129,.15)}
  .cloud-box.warn .cloud-led{background:#f59e0b}
  .cloud-box .cloud-info{flex:1;min-width:0}
  .cloud-box .cloud-title{font-size:13.5px;font-weight:650;color:var(--text)}
  .cloud-box .cloud-url{font-size:11.5px;color:var(--faint);font-family:ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .cloud-box button{
    flex:0 0 auto;min-height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);
    background:var(--card);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;
  }
  .cloud-box button:hover{border-color:var(--accent);color:var(--accent);background:var(--card)}
  #toasts{position:fixed;z-index:80;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none}
  .toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--toast-bg);color:#fff;border-radius:14px;padding:11px 14px;font-size:14px;max-width:420px;width:100%;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);animation:toastIn .24s cubic-bezier(.2,.9,.3,1.2) both}
  .toast.out{animation:toastOut .2s ease both}
  @keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.97)}}
  .toast .msg{flex:1}
  .toast button{background:transparent;border:none;color:#a5b4fc;min-height:auto;padding:6px 10px;font-weight:650;font-size:14px;border-radius:9px}
  .toast button:hover{background:rgba(255,255,255,.1);color:#c7d2fe;border:none}
  .hint{max-width:820px;margin:24px auto 0;padding:0 8px;text-align:center;font-size:12.5px;line-height:1.8;color:var(--faint)}
  .hint b{color:var(--muted)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
  @media (max-width:360px){.brand{font-size:16px}.hrow{gap:6px}.ring-btn{width:36px;height:36px;min-height:36px}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="brand">
      <span class="dot">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </span>
      <span>Shared Todo</span>
    </div>
    <button class="icon-btn" id="openSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <button class="icon-btn primary top-add" id="addSectionTop" aria-label="Add section">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>
</header>

<div class="status" id="status"><span class="led"></span><span id="statusText">Starting…</span></div>

<main id="app"></main>

<button class="fab" id="fab" aria-label="New section">
  <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<div class="sheet-wrap" id="settingsSheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet">
    <div class="sheet-grip"></div>
    <h3>Settings</h3>

    <div class="sheet-label">Appearance</div>
    <div class="theme-seg" id="themeSeg">
      <button data-theme-mode="auto">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/></svg>
        Auto
      </button>
      <button data-theme-mode="light">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        Light

<div class="hint">
  Syncs automatically to Firebase.<br>
  Open on any device — same list, everywhere.
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* ================= config ================= */
const DEFAULT_DB_URL = 'https://shared-todo-69144-default-rtdb.asia-southeast1.firebasedatabase.app';

/* ================= icons ================= */
const svg = (p, s = 18) =>
  `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  check:  svg('<polyline points="20 6 9 17 4 12"/>', 15),
  chev:   svg('<polyline points="9 18 15 12 9 6"/>', 15),
  dots:   svg('<circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/>', 18),
  trash:  svg('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/>', 15),
  sub:    svg('<polyline points="9 6 15 12 9 18"/>', 16),
  comment:svg('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>', 16),
  eyeOff: svg('<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>', 16),
};

/* ================= colors ================= */
const COLORS = ['#4f46e5','#10b981','#f59e0b','#f43f5e','#0ea5e9','#8b5cf6','#14b8a6','#f97316'];
const hexToRgba = (hex, a) => {
  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
};

/* ================= ring ================= */
const RING_R = 15.5;
const RING_C = 2 * Math.PI * RING_R;
function ringSVG(pct, allDone, empty) {
  if (empty) return `<svg viewBox="0 0 36 36" width="34" height="34"><circle cx="18" cy="18" r="${RING_R}" fill="none" stroke="currentColor" stroke-width="2.6" opacity="0.24" stroke-dasharray="3 4"/></svg>`;
  const off = RING_C - (RING_C * pct / 100);
  const inner = allDone
    ? `<polyline points="12.6,18.6 16.4,22.4 23.8,14.6" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>`
    : `<text x="18" y="21.4" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" font-family="system-ui,-apple-system,sans-serif" letter-spacing="-0.3">${pct}%</text>`;
  return `<svg viewBox="0 0 36 36" width="34" height="34">
    <circle cx="18" cy="18" r="${RING_R}" fill="none" stroke="currentColor" stroke-width="2.6" opacity="0.16"/>
    <circle cx="18" cy="18" r="${RING_R}" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="${RING_C}" stroke-dashoffset="${off}" transform="rotate(-90 18 18)" style="transition:stroke-dashoffset .35s cubic-bezier(.4,0,.2,1)"/>
    ${inner}
  </svg>`;
}

/* ================= theme ================= */
const LS_THEME = 'sharedtodo.theme';
const META = document.querySelector('meta[name="theme-color"]');
function storedTheme(){ return localStorage.getItem(LS_THEME) || 'auto'; }
function effectiveTheme(){
  const s = storedTheme();
  if (s === 'light' || s === 'dark') return s;
  return matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(mode){
  localStorage.setItem(LS_THEME, mode);
  const root = document.documentElement;
  if (mode === 'auto') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', mode);
  updateMeta(); updateSeg();
}
function updateMeta(){ META.setAttribute('content', effectiveTheme() === 'dark' ? '#0d1014' : '#f4f5f8'); }
function updateSeg(){ document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('active', b.dataset.themeMode === storedTheme())); }
if (matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'); (mq.addEventListener||mq.addListener).call(mq, 'change', () => { if (storedTheme()==='auto') updateMeta(); }); }
(function initTheme(){ const s = storedTheme(); if (s !== 'auto') document.documentElement.setAttribute('data-theme', s); updateMeta(); updateSeg(); })();

/* ================= storage ================= */
const LS_OPS = 'sharedtodo.ops';
const LS_DEV = 'sharedtodo.device';
const LS_UI = 'sharedtodo.ui';
const LS_PUSHED = 'sharedtodo.pushed';
const LS_FB = 'sharedtodo.firebase';

let deviceId = localStorage.getItem(LS_DEV);
if (!deviceId) { deviceId = 'dev-' + Math.random().toString(36).slice(2, 7); localStorage.setItem(LS_DEV, deviceId); }

let ui = { collapsed: [], openComments: [] };
try { Object.assign(ui, JSON.parse(localStorage.getItem(LS_UI) || '{}')); } catch(e){}
ui.collapsed = new Set(ui.collapsed || []);
ui.openComments = new Set(ui.openComments || []);
function saveUI(){ localStorage.setItem(LS_UI, JSON.stringify({ collapsed: [...ui.collapsed], openComments: [...ui.openComments] })); }

let ops = [];
try { ops = JSON.parse(localStorage.getItem(LS_OPS) || '[]'); } catch(e){ ops = []; }

let pushedIds = new Set();
try { pushedIds = new Set(JSON.parse(localStorage.getItem(LS_PUSHED) || '[]')); } catch(e){}

/* ================= op log ================= */
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

function addOp(op){
  op.opId = uid();
  op.ts = Date.now();
  op.device = deviceId;
  ops.push(op);
  localStorage.setItem(LS_OPS, JSON.stringify(ops));
  pushOpToFirebase(op);
}

let pendingFocus = null, pendingPop = null;
function push(op, focusId){ addOp(op); if (focusId) pendingFocus = focusId; render(); }
function updateField(id, field, value){ addOp({ type: field, id, value }); }

function mergeOps(incoming){
  const have = new Set(ops.map(o => o.opId));
  let added = 0;
  for (const o of incoming){
    if (o && o.opId && !have.has(o.opId)){ ops.push(o); have.add(o.opId); added++; }
  }
  if (added) localStorage.setItem(LS_OPS, JSON.stringify(ops));
  return added;
}

/* ================= Firebase ================= */
let fbApp = null, fbDb = null, fbOpsRef = null, fbUnsub = null;

function dbUrl(){ return localStorage.getItem(LS_FB) || DEFAULT_DB_URL; }

function timeStr(){ return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

function setCloudUI(state, title, url){
  const box = document.getElementById('cloudBox');
  const t = document.getElementById('cloudTitle');
  const u = document.getElementById('cloudUrl');
  box.classList.remove('on','warn');
  if (state === 'on') box.classList.add('on');
  if (state === 'warn') box.classList.add('warn');
  t.textContent = title;
  u.textContent = url || '—';
}

function connectFirebase(){
  const url = dbUrl();
  if (fbUnsub){ try { fbUnsub(); } catch(e){} fbUnsub = null; }
  if (fbApp){ try { fbApp.delete(); } catch(e){} fbApp = null; }

  try {
    fbApp = initializeApp({ databaseURL: url, projectId: 'shared-todo-69144' }, 'todo-' + Date.now());
    fbDb = getDatabase(fbApp);
    fbOpsRef = ref(fbDb, 'todo/ops');
  } catch(e){
    console.error(e);
    setStatus('Firebase init failed', 'warn');
    setCloudUI('warn', 'Init failed', url);
    return;
  }

  fbUnsub = onValue(fbOpsRef, (snap) => {
    const val = snap.val() || {};
    const incoming = Object.values(val);
    const added = mergeOps(incoming);
    if (added){ render(); setStatus('Pulled ' + added + ' · ' + timeStr(), 'ok'); }
    else { setStatus('In sync · ' + timeStr(), 'ok'); }
    setCloudUI('on', 'Connected', url);
  }, (err) => {
    console.error(err);
    setStatus('Listener error', 'warn');
    setCloudUI('warn', 'Error: ' + (err.code || 'unknown'), url);
  });

  setTimeout(pushAllUnsynced, 400);
}

async function pushOpToFirebase(op){
  if (!fbDb) return;
  if (pushedIds.has(op.opId)) return;
  try {
    await set(ref(fbDb, 'todo/ops/' + op.opId), op);
    pushedIds.add(op.opId);
    localStorage.setItem(LS_PUSHED, JSON.stringify([...pushedIds]));
    setStatus('Synced · ' + timeStr(), 'ok');
  } catch(e){
    console.error(e);
    setStatus('Push failed', 'warn');
  }
}

async function pushAllUnsynced(){
  if (!fbDb) return;
  const unsynced = ops.filter(o => !pushedIds.has(o.opId));
  if (!unsynced.length) return;
  for (const op of unsynced){ await pushOpToFirebase(op); }
}

/* ================= DOM helpers ================= */
const app = document.getElementById('app');
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
function setStatus(text, kind){ statusText.textContent = text; statusEl.className = 'status' + (kind ? ' ' + kind : ''); }

const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

/* ================= derive ================= */
function derive(){
  const nodes = new Map();
  const sorted = [...ops].sort((a,b) => a.ts - b.ts || (a.device < b.device ? -1 : a.device > b.device ? 1 : 0) || (a.opId < b.opId ? -1 : 1));
  for (const op of sorted){
    if (op.type === 'add'){
      nodes.set(op.id, { id: op.id, parentId: op.parentId || null, kind: op.kind, title: op.title || '', comment: '', done: false, color: op.color || null, deleted: false, order: op.ts });
    } else {
      const n = nodes.get(op.id); if (!n) continue;
      if (op.type === 'title') n.title = op.value;
      else if (op.type === 'comment') n.comment = op.value;
      else if (op.type === 'done') n.done = !!op.value;
      else if (op.type === 'delete') n.deleted = true;
      else if (op.type === 'undelete') n.deleted = false;
    }
  }
  return nodes;
}
function buildTree(nodes){
  const byParent = new Map();
  for (const n of nodes.values()){
    if (n.deleted) continue;
    const p = n.parentId || 'root';
    if (!byParent.has(p)) byParent.set(p, []);
    byParent.get(p).push(n);
  }
  for (const arr of byParent.values()) arr.sort((a,b) => a.order - b.order);
  return byParent;
}
function collectLeaves(id, tree, out = []){
  const children = tree.get(id) || [];
  for (const c of children){
    const grand = tree.get(c.id) || [];
    if (grand.length === 0) out.push(c);
    else collectLeaves(c.id, tree, out);
  }
  return out;
}

/* ================= render ================= */
function render(){
  const nodes = derive();
  const tree = buildTree(nodes);
  app.innerHTML = '';
  const sections = tree.get('root') || [];
  if (!sections.length){
    app.innerHTML = `
      <div class="empty">
        <div class="ico">${svg('<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>', 28)}</div>
        <h2>Nothing here yet</h2>
        <p>Tap <b>New section</b> to create your first list.<br>Everything syncs to the cloud.</p>
      </div>`;
    return;
  }
  sections.forEach((s, i) => app.appendChild(renderSection(s, tree, i)));

  if (pendingFocus){
    const t = app.querySelector(`[data-focus="${pendingFocus}"]`);
    if (t){ t.focus(); try { t.setSelectionRange(t.value.length, t.value.length); } catch(e){} t.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
    pendingFocus = null;
  }
  if (pendingPop){
    const t = app.querySelector(`[data-tick="${pendingPop}"]`);
    if (t){ t.classList.add('pop'); setTimeout(() => t.classList.remove('pop'), 350); }
    pendingPop = null;
  }
}

function renderSection(s, tree, index){
  const color = s.color || COLORS[index % COLORS.length];
  const leaves = collectLeaves(s.id, tree);
  const doneCount = leaves.filter(t => t.done).length;
  const allDone = leaves.length > 0 && doneCount === leaves.length;
  const pct = leaves.length ? Math.round((doneCount / leaves.length) * 100) : 0;
  const visuallyDone = leaves.length ? allDone : s.done;

  const box = el('div', 'section' + (visuallyDone ? ' is-done' : ''));
  box.dataset.id = s.id;
  box.style.setProperty('--sec', color);
  box.style.setProperty('--sec-tint', hexToRgba(color, 0.06));
  box.style.setProperty('--sec-soft', hexToRgba(color, 0.45));

  const collapsed = ui.collapsed.has(s.id);
  if (collapsed) box.classList.add('collapsed');

  const head = el('div', 'shead');
  const chev = el('button', 'chev', I.chev);
  chev.type = 'button';
  chev.setAttribute('aria-label', collapsed ? 'Expand' : 'Collapse');
  chev.onclick = () => { ui.collapsed.has(s.id) ? ui.collapsed.delete(s.id) : ui.collapsed.add(s.id); saveUI(); render(); };

  const title = el('input', 'title');
  title.type = 'text'; title.value = s.title; title.placeholder = 'Section name…'; title.dataset.focus = s.id;
  title.oninput = () => updateField(s.id, 'title', title.value);

  const count = el('span', 'sec-count' + (allDone ? ' done' : '') + (!leaves.length ? ' empty' : ''), leaves.length ? `${doneCount}/${leaves.length}` : '0');

  const ring = el('button', 'ring-btn' + (leaves.length ? '' : ' empty'));
  ring.type = 'button'; ring.dataset.tick = s.id;
  ring.setAttribute('aria-label', leaves.length ? `Section ${pct}% complete` : 'No items yet');
  ring.innerHTML = ringSVG(pct, allDone, !leaves.length);
  if (leaves.length){
    ring.onclick = () => {
      haptic(); pendingPop = s.id;
      const newState = !allDone;
      leaves.forEach(leaf => addOp({ type: 'done', id: leaf.id, value: newState }));
      if (newState && !s.done) addOp({ type: 'done', id: s.id, value: true });
      if (!newState && s.done) addOp({ type: 'done', id: s.id, value: false });
      render();
    };
  }

  const dots = el('button', 'dots', I.dots);
  dots.type = 'button'; dots.setAttribute('aria-label', 'Section menu');
  dots.onclick = (e) => {
    e.stopPropagation();
    showPop(dots, [
      { icon: I.sub, label: 'Add subsection', onClick: () => {
          const nid = uid();
          const existing = (tree.get(s.id) || []).filter(c => c.kind === 'sub').length;
          const sIdx = COLORS.indexOf(color);
          const subColor = COLORS[(sIdx + 1 + existing) % COLORS.length];
          ui.collapsed.delete(s.id); saveUI();
          push({ type: 'add', id: nid, parentId: s.id, kind: 'sub', title: '', color: subColor }, nid);
        }},
      { icon: ui.openComments.has(s.id) ? I.eyeOff : I.comment,
        label: ui.openComments.has(s.id) ? 'Hide comment' : 'Comment',
        onClick: () => {
          if (ui.openComments.has(s.id)) ui.openComments.delete(s.id); else ui.openComments.add(s.id);
          saveUI(); render();
          if (ui.openComments.has(s.id)){ const ta = app.querySelector(`[data-comment="${s.id}"]`); if (ta) ta.focus(); }
        }},
      { sep: true },
      { icon: I.trash, label: 'Delete section', danger: true, onClick: () => deleteNode(s.id, tree, 'Section') },
    ]);
  };

  head.append(chev, title, count, ring, dots);
  box.appendChild(head);

  if (leaves.length){
    const prog = el('div', 'progress');
    prog.innerHTML = `<div class="track"><div class="bar" style="width:${pct}%"></div></div>`;
    box.appendChild(prog);
  }

  if (ui.openComments.has(s.id)){
    const wrap = el('div', 'comment-wrap');
    const cmt = el('textarea', 'comment');
    cmt.value = s.comment; cmt.placeholder = 'Comment for this section…'; cmt.rows = 2; cmt.dataset.comment = s.id;
    cmt.oninput = () => updateField(s.id, 'comment', cmt.value);
    wrap.appendChild(cmt); box.appendChild(wrap);
  }

  const kids = el('div', 'children');
  for (const c of (tree.get(s.id) || [])){
    const node = c.kind === 'sub' ? renderSub(c, tree, color) : renderTask(c, color);
    if (node) kids.appendChild(node);
  }
  box.appendChild(kids);
  return box;
}

function renderSub(sub, tree, parentColor){
  let color = sub.color;
  if (!color){
    const kids = tree.get(sub.parentId) || [];
    const idx = kids.filter(c => c.kind === 'sub').indexOf(sub);
    const base = COLORS.indexOf(parentColor) < 0 ? 0 : COLORS.indexOf(parentColor);
    color = COLORS[(base + 1 + Math.max(0, idx)) % COLORS.length];
  }
  const children = tree.get(sub.id) || [];
  const leaves = collectLeaves(sub.id, tree);
  const doneCount = leaves.filter(t => t.done).length;
  const allDone = leaves.length > 0 && doneCount === leaves.length;
  const visuallyDone = leaves.length ? allDone : sub.done;
  const pct = leaves.length ? Math.round((doneCount / leaves.length) * 100) : 0;

  const box = el('div', 'sub' + (visuallyDone ? ' is-done' : ''));
  box.dataset.id = sub.id;
  box.style.setProperty('--sec', color);
  box.style.setProperty('--sec-soft', hexToRgba(color, 0.55));
  box.style.setProperty('--sec-tint', hexToRgba(color, 0.05));
  const collapsed = ui.collapsed.has(sub.id);
  if (collapsed) box.classList.add('collapsed');

  const head = el('div', 'shead');
  const tick = el('button', 'tick' + (visuallyDone ? ' done' : ''), visuallyDone ? I.check : '');
  tick.type = 'button'; tick.dataset.tick = sub.id;
  tick.setAttribute('aria-label', 'Mark subsection complete');
  tick.onclick = () => {
    haptic(); pendingPop = sub.id;
    if (leaves.length){
      const newState = !allDone;
      leaves.forEach(leaf => addOp({ type: 'done', id: leaf.id, value: newState }));
      if (newState && !sub.done) addOp({ type: 'done', id: sub.id, value: true });
      if (!newState && sub.done) addOp({ type: 'done', id: sub.id, value: false });
      render();
    } else { push({ type: 'done', id: sub.id, value: !sub.done }); }
  };
  const title = el('input', 'title');
  title.type = 'text'; title.value = sub.title; title.placeholder = 'Subsection name…'; title.dataset.focus = sub.id;
  title.oninput = () => updateField(sub.id, 'title', title.value);
  const count = el('span', 'sec-count' + (allDone ? ' done' : '') + (!leaves.length ? ' empty' : ''), leaves.length ? `${doneCount}/${leaves.length}` : '0');

  const dots = el('button', 'dots', I.dots);
  dots.type = 'button'; dots.setAttribute('aria-label', 'Subsection menu');
  dots.onclick = (e) => {
    e.stopPropagation();
    showPop(dots, [
      { icon: ui.openComments.has(sub.id) ? I.eyeOff : I.comment,
        label: ui.openComments.has(sub.id) ? 'Hide comment' : 'Comment',
        onClick: () => {
          if (ui.openComments.has(sub.id)) ui.openComments.delete(sub.id); else ui.openComments.add(sub.id);
          saveUI(); render();
          if (ui.openComments.has(sub.id)){ const ta = app.querySelector(`[data-comment="${sub.id}"]`); if (ta) ta.focus(); }
        }},
      { sep: true },
      { icon: I.trash, label: 'Delete subsection', danger: true, onClick: () => deleteNode(sub.id, tree, 'Subsection') },
    ]);
  };

  head.append(tick, title, count, dots);
  box.appendChild(head);

  if (leaves.length){
    const prog = el('div', 'progress');
    prog.innerHTML = `<div class="track"><div class="bar" style="width:${pct}%"></div></div>`;
    box.appendChild(prog);
  }

  if (ui.openComments.has(sub.id)){
    const wrap = el('div', 'comment-wrap');
    const cmt = el('textarea', 'comment');
    cmt.value = sub.comment; cmt.placeholder = 'Comment for this subsection…'; cmt.rows = 2; cmt.dataset.comment = sub.id;
    cmt.oninput = () => updateField(sub.id, 'comment', cmt.value);
    wrap.appendChild(cmt); box.appendChild(wrap);
  }

  const kids = el('div', 'children');
  for (const c of children){ const node = renderTask(c, color); if (node) kids.appendChild(node); }
  box.appendChild(kids);
  return box;
}

function renderTask(t, inheritedColor){
  const row = el('div', 'task' + (t.done ? ' is-done' : ''));
  row.dataset.id = t.id;
  if (inheritedColor) row.style.setProperty('--sec', inheritedColor);
  const tick = el('button', 'tick' + (t.done ? ' done' : ''), t.done ? I.check : '');
  tick.type = 'button'; tick.dataset.tick = t.id;
  tick.setAttribute('aria-label', 'Mark task complete');
  tick.onclick = () => { haptic(); pendingPop = t.id; push({ type: 'done', id: t.id, value: !t.done }); };
  const title = el('input', 'task-title');
  title.type = 'text'; title.value = t.title; title.placeholder = 'Task…'; title.dataset.focus = t.id;
  title.oninput = () => updateField(t.id, 'title', title.value);
  title.onkeydown = (ev) => {
    if (ev.key === 'Enter'){ ev.preventDefault(); const nid = uid(); push({ type: 'add', id: nid, parentId: t.parentId, kind: 'task', title: '' }, nid); }
    else if (ev.key === 'Backspace' && title.value === ''){
      ev.preventDefault();
      const prev = row.previousElementSibling;
      addOp({ type: 'delete', id: t.id }); render();
      if (prev){ const inp = prev.querySelector('input.task-title'); if (inp){ inp.focus(); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch(e){} } }
    }
  };
  const cmt = el('input', 'comment-line');
  cmt.type = 'text'; cmt.value = t.comment; cmt.placeholder = 'comment…';
  cmt.oninput = () => updateField(t.id, 'comment', cmt.value);
  const del = el('button', 'tdel', I.trash);
  del.type = 'button'; del.setAttribute('aria-label', 'Delete task');
  del.onclick = () => deleteNode(t.id, buildTree(derive()), 'Task');
  row.append(tick, title, cmt, del);
  return row;
}

function deleteNode(id, tree, label){
  const ids = [];
  const stack = [id];
  while (stack.length){
    const cur = stack.pop(); ids.push(cur);
    for (const c of (tree.get(cur) || [])) stack.push(c.id);
  }
  for (const i of ids) addOp({ type: 'delete', id: i });
  render(); haptic(15);
  toast(`${label} deleted`, 'Undo', () => {
    for (const i of ids) addOp({ type: 'undelete', id: i });
    render(); toast('Restored');
  }, 5000);
}

/* ================= popover ================= */
let openPop = null;
function closePop(){ if (openPop){ openPop.remove(); openPop = null; } }
function showPop(anchor, items){
  closePop();
  const m = document.createElement('div'); m.className = 'popmenu';
  for (const it of items){
    if (it.sep){ m.appendChild(el('div', 'pmi-sep')); continue; }
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pmi' + (it.danger ? ' danger' : '');
    b.innerHTML = `<span class="pmi-ico">${it.icon || ''}</span><span>${it.label}</span>`;
    b.onclick = (e) => { e.stopPropagation(); closePop(); it.onClick(); };
    m.appendChild(b);
  }
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  const mw = m.offsetWidth, mh = m.offsetHeight;
  let x = r.right - mw, y = r.bottom + 6;
  if (y + mh > innerHeight - 10) y = r.top - mh - 6;
  x = Math.max(8, Math.min(x, innerWidth - mw - 8));
  y = Math.max(8, y);
  m.style.left = x + 'px'; m.style.top = y + 'px';
  openPop = m;
}
document.addEventListener('click', (e) => { if (openPop && !openPop.contains(e.target)) closePop(); });
window.addEventListener('scroll', closePop, { passive: true });
window.addEventListener('resize', closePop);

/* ================= toast ================= */
const toastsEl = document.getElementById('toasts');
function toast(msg, actionLabel, actionFn, ms = 2600){
  const t = el('div', 'toast');
  const m = document.createElement('span'); m.className = 'msg'; m.textContent = msg; t.appendChild(m);
  let timer;
  const close = () => { clearTimeout(timer); t.classList.add('out'); setTimeout(() => t.remove(), 200); };
  if (actionLabel && actionFn){
    const b = document.createElement('button'); b.textContent = actionLabel;
    b.onclick = () => { actionFn(); close(); };
    t.appendChild(b);
  }
  toastsEl.appendChild(t);
  timer = setTimeout(close, ms);
}
function haptic(ms = 8){ if (navigator.vibrate){ try { navigator.vibrate(ms); } catch(e){} } }

/* ================= settings sheet ================= */
const settingsSheet = document.getElementById('settingsSheet');
function openSheet(){ settingsSheet.hidden = false; }
function closeSheet(){ settingsSheet.hidden = true; }
document.getElementById('openSettings').onclick = openSheet;
settingsSheet.addEventListener('click', (e) => { if (e.target.hasAttribute('data-close')) closeSheet(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape'){ closeSheet(); closePop(); } });

document.querySelectorAll('#themeSeg button').forEach(b => {
  b.addEventListener('click', () => { applyTheme(b.dataset.themeMode); haptic(5); });
});

document.getElementById('cloudReconnect').onclick = () => {
  connectFirebase();
  toast('Reconnecting…');
};

document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify({ version: 1, device: deviceId, ops }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `todo-${deviceId}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  closeSheet(); toast('Exported');
};

document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();

document.getElementById('importFile').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const n = mergeOps(data.ops || []);
    if (n) { ops.filter(o => !pushedIds.has(o.opId)).forEach(pushOpToFirebase); render(); }
    closeSheet(); toast(n ? `Merged ${n} changes` : 'Nothing new');
  } catch(err){ toast('Could not read that file'); }
  e.target.value = '';
};

document.getElementById('resetBtn').onclick = () => {
  if (!confirm('Clear local cache on this device?\n(Cloud data is not affected)')) return;
  localStorage.removeItem(LS_OPS);
  localStorage.removeItem(LS_UI);
  localStorage.removeItem(LS_PUSHED);
  ops = []; pushedIds = new Set(); ui.collapsed = new Set(); ui.openComments = new Set();
  closeSheet(); render(); toast('Local cache cleared');
};

/* ================= add section ================= */
function nextColor(){ const count = (buildTree(derive()).get('root') || []).length; return COLORS[count % COLORS.length]; }
function addSection(){ const nid = uid(); push({ type: 'add', id: nid, parentId: null, kind: 'section', title: '', color: nextColor() }, nid); }
document.getElementById('addSectionTop').onclick = addSection;
document.getElementById('fab').onclick = addSection;

/* ================= start ================= */
setCloudUI('warn', 'Connecting…', dbUrl());
connectFirebase();
render();
</script>
